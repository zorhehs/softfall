name: Build

on:
  push:
    # Feature branches build too: there is no Xcode on the machine this is
    # written on, so CI is the only compiler.
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    name: Build and bundle
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          sw_vers

      # Debug first: it is the fastest way to surface a compile error.
      - name: Compile
        run: swift build -c debug

      - name: Build the app bundle
        run: Scripts/build-app.sh 0.0.0-ci

      - name: Verify the bundle
        run: |
          APP=dist/Softfall.app
          test -x "$APP/Contents/MacOS/Softfall"
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          echo "--- architectures ---"
          lipo -info "$APP/Contents/MacOS/Softfall"
          echo "--- signature ---"
          codesign -dv "$APP" 2>&1 | head -n 5
          echo "--- activation policy ---"
          # Softfall is a regular app now. LSUIElement would make it launch as
          # an accessory and fight the .regular policy set in main.swift.
          if /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$APP/Contents/Info.plist" >/dev/null 2>&1; then
            echo "error: LSUIElement is present — the app would launch without a Dock icon" >&2
            exit 1
          fi
          echo "LSUIElement absent, as a windowed app needs"
          echo "--- minimum system version ---"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: Softfall-app
          path: dist/Softfall.app
          retention-days: 14
